{% extends "base.html" %}

{% block title %}Student Registration &bull; AI Proctor Examination Portal{% endblock %}

{% block content %}
<div class="container py-5 my-auto">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
      <div class="card card-glass p-4 p-md-5 border-0 shadow-lg">
        <div class="text-center mb-4">
          <div class="brand-icon-badge mx-auto mb-3" style="width: 48px; height: 48px; font-size: 1.3rem;">
            <i class="fas fa-user-plus"></i>
          </div>
          <h3 class="fw-bold text-dark">Student Registration</h3>
          <p class="text-muted small">Create your student candidate profile to access proctored exams</p>
        </div>

        <form method="POST" action="{{ url_for('auth.register') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Full Name <span class="text-danger">*</span></label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-user"></i></span>
              <input type="text" name="full_name" class="form-control border-start-0" placeholder="e.g. John Doe" required autofocus>
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary small">Registration Number <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-id-card"></i></span>
                <input type="text" name="registration_number" class="form-control border-start-0" placeholder="e.g. CS2026-089" required>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary small">Email Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-envelope"></i></span>
                <input type="email" name="email" class="form-control border-start-0" placeholder="john@example.com" required>
              </div>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary small">Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock"></i></span>
                <input type="password" name="password" class="form-control border-start-0" placeholder="Min 6 characters" required>
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold text-secondary small">Confirm Password <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="fas fa-lock-open"></i></span>
                <input type="password" name="confirm_password" class="form-control border-start-0" placeholder="Confirm password" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
            <i class="fas fa-id-badge me-2"></i> Register Student Account
          </button>
        </form>

        <div class="text-center pt-3 border-top">
          <small class="text-muted">Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Sign in here</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
