{% extends "base.html" %}

{% block title %}Create Examination &bull; Admin Portal{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-glass p-4 p-md-5 border-0 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Create New Examination</h3>
            <p class="text-muted small mb-0">Define exam metadata, time limits, and scoring parameters</p>
          </div>
          <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Cancel
          </a>
        </div>

        <form method="POST" action="{{ url_for('admin.create_exam') }}">
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold text-secondary small">Exam Title <span class="text-danger">*</span></label>
              <input type="text" name="title" class="form-control" placeholder="e.g. Advanced Python Programming & Architecture" required autofocus>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold text-secondary small">Subject / Domain <span class="text-danger">*</span></label>
              <input type="text" name="subject" class="form-control" placeholder="e.g. Computer Science" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Exam Description</label>
            <textarea name="description" class="form-control" rows="3" placeholder="Provide syllabus, prerequisites, or student instructions..."></textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Duration (Minutes)</label>
              <input type="number" name="duration_minutes" class="form-control" value="60" min="5" max="300" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Total Marks</label>
              <input type="number" name="total_marks" class="form-control" value="100" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Passing Marks</label>
              <input type="number" name="passing_marks" class="form-control" value="40" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Publication Status</label>
              <select name="status" class="form-select">
                <option value="published" selected>Published (Active)</option>
                <option value="draft">Draft (Hidden)</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-end gap-2 border-top pt-3">
            <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary">Discard</a>
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              <i class="fas fa-check me-1"></i> Save &amp; Add Questions
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
