{% extends "base.html" %}

{% block title %}Edit Exam &bull; {{ exam.title }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card card-glass p-4 p-md-5 border-0 shadow-sm">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
          <div>
            <h3 class="fw-bold text-dark mb-1">Edit Examination Details</h3>
            <p class="text-muted small mb-0">Modify configuration parameters for <code>#{{ exam.id }}</code></p>
          </div>
          <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Back
          </a>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_exam', exam_id=exam.id) }}">
          <div class="row g-3 mb-3">
            <div class="col-md-8">
              <label class="form-label fw-semibold text-secondary small">Exam Title <span class="text-danger">*</span></label>
              <input type="text" name="title" class="form-control" value="{{ exam.title }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold text-secondary small">Subject / Domain <span class="text-danger">*</span></label>
              <input type="text" name="subject" class="form-control" value="{{ exam.subject }}" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold text-secondary small">Exam Description</label>
            <textarea name="description" class="form-control" rows="3">{{ exam.description }}</textarea>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Duration (Minutes)</label>
              <input type="number" name="duration_minutes" class="form-control" value="{{ exam.duration_minutes }}" min="5" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Total Marks</label>
              <input type="number" name="total_marks" class="form-control" value="{{ exam.total_marks }}" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Passing Marks</label>
              <input type="number" name="passing_marks" class="form-control" value="{{ exam.passing_marks }}" min="1" required>
            </div>
            <div class="col-md-3">
              <label class="form-label fw-semibold text-secondary small">Publication Status</label>
              <select name="status" class="form-select">
                <option value="published" {% if exam.status == 'published' %}selected{% endif %}>Published</option>
                <option value="draft" {% if exam.status == 'draft' %}selected{% endif %}>Draft</option>
              </select>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center border-top pt-3">
            <a href="{{ url_for('admin.exam_questions', exam_id=exam.id) }}" class="btn btn-outline-primary">
              <i class="fas fa-list-check me-1"></i> Manage {{ exam.question_count }} Questions
            </a>
            <div class="d-flex gap-2">
              <a href="{{ url_for('admin.exams') }}" class="btn btn-outline-secondary">Cancel</a>
              <button type="submit" class="btn btn-primary px-4 fw-semibold">
                <i class="fas fa-check me-1"></i> Update Exam
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
