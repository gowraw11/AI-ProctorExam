{% extends "base.html" %}
{% block title %}System Error &bull; 500{% endblock %}
{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5 max-w-500 mx-auto">
    <div class="display-1 text-warning fw-bold mb-3"><i class="fas fa-triangle-exclamation"></i> 500</div>
    <h2 class="fw-bold text-dark mb-2">Internal Server Error</h2>
    <p class="text-muted mb-4">An unexpected anomaly occurred while processing your request. Our proctoring safeguards remain securely intact.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-2"></i> Go to Homepage</a>
  </div>
</div>
{% endblock %}
