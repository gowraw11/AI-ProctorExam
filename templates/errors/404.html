{% extends "base.html" %}
{% block title %}Page Not Found &bull; 404{% endblock %}
{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5 max-w-500 mx-auto">
    <div class="display-1 text-primary fw-bold mb-3"><i class="fas fa-compass"></i> 404</div>
    <h2 class="fw-bold text-dark mb-2">Page Not Found</h2>
    <p class="text-muted mb-4">The examination, question set, or report page you requested does not exist or has been relocated.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-2"></i> Go to Homepage</a>
  </div>
</div>
{% endblock %}
