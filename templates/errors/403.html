{% extends "base.html" %}
{% block title %}Access Denied &bull; 403 Forbidden{% endblock %}
{% block content %}
<div class="container py-5 text-center my-auto">
  <div class="py-5 max-w-500 mx-auto">
    <div class="display-1 text-danger fw-bold mb-3"><i class="fas fa-lock"></i> 403</div>
    <h2 class="fw-bold text-dark mb-2">Access Forbidden</h2>
    <p class="text-muted mb-4">You do not possess the necessary authorization credentials to view this examination or administration portal resource.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="fas fa-home me-2"></i> Return to Safety</a>
  </div>
</div>
{% endblock %}
